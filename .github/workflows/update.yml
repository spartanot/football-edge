name: Update data

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas pyarrow scipy numpy

      - name: Download latest data and rebuild the model
        run: python update.py

      - name: College football data
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python update_cfb.py

      - name: Save data.json to the repository
        continue-on-error: true
        run: |
          mkdir -p /tmp/keep
          cp -r data.json cfb_data.json cfb_eval.json cfb_features.json cfb_cache /tmp/keep/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/keep/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git add cfb_data.json 2>/dev/null || true
          git add cfb_cache 2>/dev/null || true
          git add cfb_eval.json cfb_features.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update data"
          git push

      - name: Prepare website files
        run: |
          mkdir site
          cp index.html college.html data.json site/
          cp cfb_data.json site/ 2>/dev/null || true
          cp cfb_eval.json site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
